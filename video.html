<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reprodutor de Vídeo - tutorsais.mp4</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #1e1e24;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }

        h1 {
            color: #ff4757;
            margin-bottom: 5px;
        }

        p {
            color: #a4b0be;
            margin-bottom: 25px;
        }

        .container {
            width: 100%;
            max-width: 800px;
            background: #2f3542;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 8px 16px rgba(0,0,0,0.3);
            text-align: center;
        }

        video {
            width: 100%;
            border-radius: 8px;
            background-color: #000;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
        }

        .status-box {
            margin-top: 15px;
            font-size: 0.9rem;
            color: #7bed9f;
            background: rgba(46, 213, 115, 0.1);
            padding: 10px;
            border-radius: 6px;
            display: inline-block;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Reprodutor de Vídeo</h1>
        <p>Arquivo atual: <strong>tutorsais.mp4</strong></p>
        
        <!-- O player de vídeo aponta diretamente para a raiz do servidor -->
        <video id="videoPlayer" controls autoplay preload="auto">
            <!-- Força o codec padrão do HandBrake (H.264 + AAC) para evitar erro de tipo MIME -->
            <source src="tutorsais.mp4" type="video/mp4; codecs='avc1.42E01E, mp4a.40.2'">
            Seu navegador não suporta a reprodução deste formato ou tipo MIME no Firefox.
        </video>

        <div class="status-box">
            Pronto para reprodução via Servidor Web
        </div>
    </div>

</body>
</html>
