<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jogo da Velha com Import/Export</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Arial', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            background: white;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            text-align: center;
            max-width: 600px;
        }

        h1 {
            color: #333;
            margin-bottom: 10px;
            font-size: 2.5em;
        }

        .status {
            font-size: 1.3em;
            margin: 20px 0;
            color: #555;
            font-weight: bold;
            min-height: 30px;
        }

        .board {
            display: grid;
            grid-template-columns: repeat(3, 120px);
            grid-template-rows: repeat(3, 120px);
            gap: 10px;
            margin: 20px auto;
        }

        .cell {
            background: #f0f0f0;
            border: 3px solid #667eea;
            border-radius: 10px;
            font-size: 3em;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
            user-select: none;
        }

        .cell:hover:not(.taken) {
            background: #e0e0ff;
            transform: scale(1.05);
        }

        .cell.taken {
            cursor: not-allowed;
        }

        .cell.x {
            color: #667eea;
        }

        .cell.o {
            color: #764ba2;
        }

        .cell.winner {
            background: #ffd700;
            animation: pulse 0.5s ease-in-out;
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.1); }
        }

        .checksum-section {
            margin-top: 30px;
            padding: 20px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border-radius: 15px;
            color: white;
        }

        .checksum-label {
            font-size: 1.2em;
            margin-bottom: 10px;
            font-weight: bold;
        }

        .checksum-display {
            font-size: 2em;
            font-weight: bold;
            font-family: 'Courier New', monospace;
            background: rgba(255,255,255,0.2);
            padding: 15px;
            border-radius: 10px;
            letter-spacing: 2px;
            margin-bottom: 15px;
            word-break: break-all;
        }

        .copy-btn {
            background: rgba(255,255,255,0.3);
            color: white;
            border: 2px solid white;
            padding: 10px 20px;
            font-size: 1em;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s;
            font-weight: bold;
            margin: 5px;
        }

        .copy-btn:hover {
            background: rgba(255,255,255,0.5);
        }

        .input-section {
            margin-top: 15px;
            display: flex;
            gap: 10px;
            align-items: center;
        }

        .checksum-input {
            flex: 1;
            padding: 12px;
            font-size: 1.1em;
            font-family: 'Courier New', monospace;
            border: 2px solid white;
            border-radius: 8px;
            background: rgba(255,255,255,0.9);
            color: #333;
        }

        .load-btn {
            background: white;
            color: #667eea;
            border: none;
            padding: 12px 24px;
            font-size: 1em;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s;
            font-weight: bold;
        }

        .load-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
        }

        .controls {
            margin-top: 20px;
        }

        button {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 15px 30px;
            font-size: 1.1em;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.3s;
            font-weight: bold;
            margin: 5px;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
        }

        .game-info {
            margin-top: 20px;
            padding: 15px;
            background: #f8f9fa;
            border-radius: 10px;
            text-align: left;
        }

        .game-info h3 {
            color: #667eea;
            margin-bottom: 10px;
        }

        .game-info p {
            color: #666;
            line-height: 1.6;
            margin: 5px 0;
        }

        .notification {
            position: fixed;
            top: 20px;
            right: 20px;
            background: #4caf50;
            color: white;
            padding: 15px 25px;
            border-radius: 10px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
            animation: slideIn 0.3s ease-out;
            z-index: 1000;
        }

        @keyframes slideIn {
            from {
                transform: translateX(400px);
                opacity: 0;
            }
            to {
                transform: translateX(0);
                opacity: 1;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎮 Jogo da Velha</h1>
        <div class="status" id="status">Vez do Jogador X</div>
        
        <div class="board" id="board">
            <div class="cell" data-position="0"></div>
            <div class="cell" data-position="1"></div>
            <div class="cell" data-position="2"></div>
            <div class="cell" data-position="3"></div>
            <div class="cell" data-position="4"></div>
            <div class="cell" data-position="5"></div>
            <div class="cell" data-position="6"></div>
            <div class="cell" data-position="7"></div>
            <div class="cell" data-position="8"></div>
        </div>

        <div class="checksum-section">
            <div class="checksum-label">🔢 Casa 10 - Checksum (SAÍDA)</div>
            <div class="checksum-display" id="checksum">000000000</div>
            <button class="copy-btn" onclick="copyChecksum()">📋 Copiar Checksum</button>
            
            <div class="input-section">
                <input type="text" class="checksum-input" id="checksumInput" placeholder="Cole o checksum aqui...">
                <button class="load-btn" onclick="loadFromChecksum()">📥 Carregar</button>
            </div>
        </div>

        <div class="controls">
            <button onclick="resetGame()">🔄 Novo Jogo</button>
        </div>

        <div class="game-info">
            <h3>📋 Como Usar</h3>
            <p><strong>Exportar:</strong> Copie o checksum após cada jogada e envie para o outro jogador.</p>
            <p><strong>Importar:</strong> Cole o checksum recebido e clique em "Carregar" para recriar o jogo.</p>
            <p>Cada checksum representa um estado único do jogo!</p>
        </div>
    </div>

    <script>
        let board = ['', '', '', '', '', '', '', '', ''];
        let currentPlayer = 'X';
        let gameActive = true;

        const winConditions = [
            [0, 1, 2], [3, 4, 5], [6, 7, 8],
            [0, 3, 6], [1, 4, 7], [2, 5, 8],
            [0, 4, 8], [2, 4, 6]
        ];

        function calculateChecksum() {
            let checksum = 0;
            for (let i = 0; i < 9; i++) {
                let value = 0;
                if (board[i] === 'X') value = 1;
                else if (board[i] === 'O') value = 2;
                checksum += value * Math.pow(3, i);
            }
            return checksum.toString().padStart(9, '0');
        }

        function decodeChecksum(checksumStr) {
            const checksum = parseInt(checksumStr);
            const newBoard = ['', '', '', '', '', '', '', '', ''];
            let remaining = checksum;
            
            for (let i = 0; i < 9; i++) {
                const power = Math.pow(3, i);
                const value = Math.floor(remaining / power) % 3;
                
                if (value === 0) newBoard[i] = '';
                else if (value === 1) newBoard[i] = 'X';
                else if (value === 2) newBoard[i] = 'O';
            }
            
            return newBoard;
        }

        function updateChecksum() {
            const checksum = calculateChecksum();
            document.getElementById('checksum').textContent = checksum;
        }

        function copyChecksum() {
            const checksum = document.getElementById('checksum').textContent;
            navigator.clipboard.writeText(checksum).then(() => {
                showNotification('✅ Checksum copiado!');
            });
        }

        function loadFromChecksum() {
            const input = document.getElementById('checksumInput').value.trim();
            
            if (!input) {
                showNotification('❌ Cole um checksum válido!', 'error');
                return;
            }
            
            try {
                const newBoard = decodeChecksum(input);
                board = newBoard;
                
                // Atualizar visual
                const cells = document.querySelectorAll('.cell');
                cells.forEach((cell, index) => {
                    cell.textContent = board[index];
                    cell.classList.remove('taken', 'x', 'o', 'winner');
                    
                    if (board[index]) {
                        cell.classList.add('taken', board[index].toLowerCase());
                    }
                });
                
                // Determinar próximo jogador
                const xCount = board.filter(cell => cell === 'X').length;
                const oCount = board.filter(cell => cell === 'O').length;
                currentPlayer = xCount === oCount ? 'X' : 'O';
                
                // Verificar se o jogo já acabou
                if (checkWinForPlayer('X')) {
                    document.getElementById('status').textContent = '🎉 Jogador X venceu!';
                    gameActive = false;
                } else if (checkWinForPlayer('O')) {
                    document.getElementById('status').textContent = '🎉 Jogador O venceu!';
                    gameActive = false;
                } else if (board.every(cell => cell !== '')) {
                    document.getElementById('status').textContent = '🤝 Empate!';
                    gameActive = false;
                } else {
                    document.getElementById('status').textContent = `Vez do Jogador ${currentPlayer}`;
                    gameActive = true;
                }
                
                updateChecksum();
                showNotification('✅ Jogo carregado com sucesso!');
                document.getElementById('checksumInput').value = '';
                
            } catch (error) {
                showNotification('❌ Checksum inválido!', 'error');
            }
        }

        function checkWinForPlayer(player) {
            return winConditions.some(condition => {
                return condition.every(position => board[position] === player);
            });
        }

        function handleCellClick(event) {
            const cell = event.target;
            const position = parseInt(cell.getAttribute('data-position'));

            if (board[position] !== '' || !gameActive) {
                return;
            }

            board[position] = currentPlayer;
            cell.textContent = currentPlayer;
            cell.classList.add('taken', currentPlayer.toLowerCase());

            if (checkWinForPlayer(currentPlayer)) {
                document.getElementById('status').textContent = `🎉 Jogador ${currentPlayer} venceu!`;
                gameActive = false;
                highlightWinner();
            } else if (board.every(cell => cell !== '')) {
                document.getElementById('status').textContent = '🤝 Empate!';
                gameActive = false;
            } else {
                currentPlayer = currentPlayer === 'X' ? 'O' : 'X';
                document.getElementById('status').textContent = `Vez do Jogador ${currentPlayer}`;
            }

            updateChecksum();
        }

        function highlightWinner() {
            winConditions.forEach(condition => {
                if (condition.every(position => board[position] === currentPlayer)) {
                    condition.forEach(position => {
                        document.querySelector(`[data-position="${position}"]`).classList.add('winner');
                    });
                }
            });
        }

        function resetGame() {
            board = ['', '', '', '', '', '', '', '', ''];
            currentPlayer = 'X';
            gameActive = true;
            document.getElementById('status').textContent = 'Vez do Jogador X';
            
            const cells = document.querySelectorAll('.cell');
            cells.forEach(cell => {
                cell.textContent = '';
                cell.classList.remove('taken', 'x', 'o', 'winner');
            });

            updateChecksum();
        }

        function showNotification(message, type = 'success') {
            const notification = document.createElement('div');
            notification.className = 'notification';
            notification.textContent = message;
            if (type === 'error') {
                notification.style.background = '#f44336';
            }
            document.body.appendChild(notification);
            
            setTimeout(() => {
                notification.remove();
            }, 3000);
        }

        document.querySelectorAll('.cell').forEach(cell => {
            cell.addEventListener('click', handleCellClick);
        });

        updateChecksum();
    </script>
</body>
</html>
